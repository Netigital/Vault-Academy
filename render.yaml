services:
  - type: web
    name: vault-academy-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: vault-academy-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: VAULT_ACADEMY_DATA_DIR
        value: /var/data
      - key: FRONTEND_HOST
        value: vault-academy-web.onrender.com
      - key: VAULT_ACADEMY_ADMIN_PASSCODE
        sync: false
      - key: VAULT_ACADEMY_TEACHER_INVITE
        sync: false
  - type: web
    name: vault-academy-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: vault-academy-api
          property: host
